    <!-- Marcador con un agujero circular -->
    <path fill-rule="evenodd" d="M54 66 C54 66 40 52 40 42 A14 14 0 0 1 68 42 C68 52 54 66 54 66 Z M54 37 A5 5 0 1 0 54 47 A5 5 0 1 0 54 37 Z"/>
  </g>
</svg>
